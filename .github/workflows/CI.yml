name: CI

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style:
    name: Check Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --no-self-update

      - name: cargo fmt --check
        run: cargo fmt --all --check

  test:
    name: Test
    needs: [ style ]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        build: [ stable, beta, nightly ]
        include:
          - build: nightly
            benches: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rust
        run: |
          rustup toolchain install ${{ matrix.build }} --profile minimal --no-self-update
          rustup default ${{ matrix.build }}

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Build debug
        run: cargo build --all

      - name: Create /var/run/horust directory
        run: sudo mkdir -p /var/run/horust && sudo chmod 777 /var/run/horust

      - name: Test
        run: cargo test

  docker-build-push:
    needs: [ test ]
    strategy:
      matrix:
        platform: ["amd64", "arm64"]
    runs-on: ${{ matrix.platform == 'amd64' && 'ubuntu-22.04' || 'ubuntu-22.04-arm' }}
    permissions:
      contents: read  # checkout
      packages: write  # push to ghcr.io
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/horust
            federicoponzi/horust
          flavor: |
            latest=false
            suffix=-${{ matrix.platform }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          provenance: false  # avoid push manifest-list

  # amend the platform tag for docker images
  docker-manifests:
    needs: ["docker-build-push"]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master'
    permissions:
      packages: write  # push to ghcr.io
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get the semver
        id: semver
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'master' }}
        run: |
          SEMVER="${VERSION#v}"
          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
      - name: Create manifests
        run: |
          AMD_TAG=${SEMVER}-amd64
          ARM_TAG=${SEMVER}-arm64
          docker manifest create \
            ghcr.io/federicoponzi/horust:${SEMVER} \
            --amend ghcr.io/federicoponzi/horust:${AMD_TAG} \
            --amend ghcr.io/federicoponzi/horust:${ARM_TAG}
          docker manifest push ghcr.io/federicoponzi/horust:${SEMVER}
          docker manifest create \
            federicoponzi/horust:${SEMVER} \
            --amend federicoponzi/horust:${AMD_TAG} \
            --amend federicoponzi/horust:${ARM_TAG}
          docker manifest push federicoponzi/horust:${SEMVER}
        env:
          SEMVER: ${{ steps.semver.outputs.semver }}

  ## Publish crates to crates.io. Runs only for tags with semver format.
  publish-crates:
    name: Publish to crates.io
    needs: [ test ]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      id-token: write # Required for OIDC token exchange
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish horust-commands-lib
        run: cargo publish --package horust-commands-lib
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Publish horust
        run: cargo publish --package horust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish horustctl
        run: cargo publish --package horustctl
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  ## Cross-build the release binaries for all targets. Acts as a build check on master.
  build-release:
    name: Build release binaries
    needs: [ test ]
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04  # glibc 2.35
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} --no-self-update

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install cross
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cross

      - name: Build target
        run: |
          cross build --release --package horust --bin horust --target ${{ matrix.target }}
          cross build --release --package horustctl --bin horustctl --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../horust-${{ matrix.target }}.tar.gz horust horustctl
          cd -

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: horust-${{ matrix.target }}
          path: horust-${{ matrix.target }}.tar.gz
          retention-days: 1  # only consumed by publish-release within the same run

  ## Create the GitHub release from the built artifacts. Runs only for tags with semver format.
  publish-release:
    name: Publish release
    needs: [ build-release ]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create release and upload assets
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: horust-*
          merge-multiple: true

      - name: Create release
        run: |
          gh release create "${GITHUB_REF_NAME}" horust-*.tar.gz --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" horust-*.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
